<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Player – Sequences</title>
<style>
  body{font-family:sans-serif;margin:0;background:#111;color:#eee;padding:16px}
  h1{margin:0 0 16px;font-size:1.4rem;color:#4af}
  nav a{color:#4af;margin-right:16px;text-decoration:none;font-size:.9rem}
  .card{background:#1e1e1e;border-radius:8px;padding:16px;margin-bottom:16px}
  ul{list-style:none;padding:0;margin:0}
  li{padding:10px 8px;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between}
  li:last-child{border-bottom:none}
  button{background:#4af;color:#000;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-weight:bold}
  .empty{color:#888;font-style:italic}
</style>
</head>
<body>
<h1>SB Player &ndash; Sequences</h1>
<nav>
  <a href="/">Dashboard</a>
  <a href="/config.html">Config</a>
  <a href="/outputs.html">Outputs</a>
  <a href="/sequences.html">Sequences</a>
  <a href="/playlists.html">Playlists</a>
  <a href="/schedule.html">Schedule</a>
  <a href="/ota.html">OTA</a>
</nav>

<div class="card">
  <p style="color:#888;font-size:.85rem">FSEQ files in <code>/sequences/</code> on the SD card. Place matching audio files (same name, .wav or .mp3) alongside them.</p>
  <ul id="list"><li class="empty">Loading...</li></ul>
</div>

<script>
function play(f) {
  fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({file:f})});
}
fetch('/api/sequences').then(r=>r.json()).then(data => {
  const ul = document.getElementById('list');
  if (!data.sd_ok) { ul.innerHTML = '<li class="empty" style="color:#f84">&#9888; SD card not found</li>'; return; }
  const list = data.files || [];
  if (!list.length) { ul.innerHTML = '<li class="empty">No .fseq files found on SD card</li>'; return; }
  ul.innerHTML = list.map(f=>`<li><span>${f}</span><button onclick="play('${f}')">Play</button></li>`).join('');
});
</script>
</body>
</html>
