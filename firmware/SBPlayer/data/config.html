<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Player &ndash; Config</title>
<style>
  body{font-family:sans-serif;margin:0;background:#111;color:#eee;padding:16px}
  h1{margin:0 0 16px;font-size:1.4rem;color:#4af}
  h2{font-size:1rem;color:#4af;margin:16px 0 8px;border-top:1px solid #333;padding-top:12px}
  nav a{color:#4af;margin-right:16px;text-decoration:none;font-size:.9rem}
  .card{background:#1e1e1e;border-radius:8px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:#888;margin:8px 0 2px}
  label.check{display:flex;align-items:center;gap:8px;color:#ccc;margin:8px 0}
  input[type=text],input[type=password],input[type=number]{
    background:#222;color:#eee;border:1px solid #444;padding:6px 8px;
    border-radius:4px;width:100%;box-sizing:border-box}
  input[type=checkbox]{width:18px;height:18px;cursor:pointer}
  button{background:#4af;color:#000;border:none;padding:8px 20px;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:12px}
  #msg{margin-top:10px;font-size:.9rem;padding:6px 10px;border-radius:4px;display:none}
  #msg.ok{background:#1a3a1a;color:#4f4;display:block}
  #msg.err{background:#3a1a1a;color:#f44;display:block}
</style>
</head>
<body>
<h1>SB Player &ndash; Config</h1>
<nav>
  <a href="/">Dashboard</a>
  <a href="/config.html">Config</a>
  <a href="/outputs.html">Outputs</a>
  <a href="/sequences.html">Sequences</a>
  <a href="/playlists.html">Playlists</a>
  <a href="/schedule.html">Schedule</a>
  <a href="/ota.html">OTA</a>
</nav>

<div class="card">

  <h2>Device</h2>
  <label>Hostname</label>
  <input type="text" id="hostname">
  <label>WiFi AP SSID</label>
  <input type="text" id="ap_ssid">
  <label>WiFi AP Password (leave blank to keep current)</label>
  <input type="password" id="ap_password" placeholder="unchanged">
  <label>NTP Server</label>
  <input type="text" id="ntp_server">
  <label>Timezone Offset (hours from UTC, e.g. -4 for EDT)</label>
  <input type="number" id="tz_offset_hours" min="-12" max="14" step="0.5">

  <h2>Ethernet</h2>
  <label class="check"><input type="checkbox" id="eth_enabled"> Enable Ethernet</label>
  <label>PHY Address</label>
  <input type="number" id="eth_phy_addr">
  <label>Power Pin (−1 = none)</label>
  <input type="number" id="eth_power_pin">
  <label>MDC Pin</label>
  <input type="number" id="eth_mdc_pin">
  <label>MDIO Pin</label>
  <input type="number" id="eth_mdio_pin">
  <label class="check"><input type="checkbox" id="eth_static"> Use Static IP</label>
  <label>IP Address</label>
  <input type="text" id="eth_ip">
  <label>Gateway</label>
  <input type="text" id="eth_gateway">
  <label>Subnet Mask</label>
  <input type="text" id="eth_subnet">
  <label>DNS</label>
  <input type="text" id="eth_dns">

  <h2>Audio (UDA1334A I²S)</h2>
  <label>Volume (0&ndash;100)</label>
  <input type="number" id="audio_volume" min="0" max="100">
  <label>BCLK Pin</label>
  <input type="number" id="i2s_bclk">
  <label>LRCLK Pin</label>
  <input type="number" id="i2s_lrclk">
  <label>DATA Pin</label>
  <input type="number" id="i2s_data">

  <h2>FPP MultiSync</h2>
  <label class="check"><input type="checkbox" id="multisync_enabled"> Enable MultiSync Master</label>
  <label>UDP Port</label>
  <input type="number" id="multisync_port">

  <h2>OLED Display</h2>
  <label class="check"><input type="checkbox" id="oled_enabled"> Enable OLED (SSD1306)</label>
  <label>SDA Pin</label>
  <input type="number" id="oled_sda">
  <label>SCL Pin</label>
  <input type="number" id="oled_scl">

  <h2>RTC (Real-Time Clock, shares I²C with OLED)</h2>
  <label class="check"><input type="checkbox" id="rtc_enabled"> Enable RTC</label>
  <label>Chip Type</label>
  <select id="rtc_type" style="background:#222;color:#eee;border:1px solid #444;padding:6px 8px;border-radius:4px;width:100%;box-sizing:border-box">
    <option value="DS3231">DS3231</option>
    <option value="DS1307">DS1307</option>
    <option value="PCF8523">PCF8523</option>
  </select>
  <div id="rtcTimeRow" style="display:none;margin-top:10px;padding:10px;background:#161616;border-radius:6px">
    <div style="font-size:.85rem;color:#888;margin-bottom:8px">RTC time: <span id="rtcNow" style="color:#ccc">—</span></div>
    <label>Set RTC Time</label>
    <input type="datetime-local" id="rtcSetVal" style="margin-bottom:6px">
    <div>
      <button onclick="useNow()" style="background:#555;margin-right:8px">Browser Time</button>
      <button onclick="setRtcTime()">Set RTC</button>
    </div>
  </div>

  <br>
  <button onclick="save()">Save</button>
  <button onclick="reboot()" style="background:#f80;margin-left:8px">Reboot</button>
  <div id="msg"></div>
</div>

<script>
const CHECKBOXES = ['eth_enabled','eth_static','multisync_enabled','oled_enabled','rtc_enabled'];
const NUMBERS    = ['eth_phy_addr','eth_power_pin','eth_mdc_pin','eth_mdio_pin',
                    'audio_volume','i2s_bclk','i2s_lrclk','i2s_data',
                    'multisync_port','oled_sda','oled_scl'];
// tz_offset_hours is display-only; converted to/from tz_offset_mins in load/save
const SELECTS    = ['rtc_type'];

function msg(text, isErr) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = isErr ? 'err' : 'ok';
}

// Load RTC status
fetch('/api/rtc')
  .then(r => r.json())
  .then(data => {
    if (!data.available) return;
    document.getElementById('rtcTimeRow').style.display = '';
    if (data.epoch) {
      document.getElementById('rtcNow').textContent = new Date(data.epoch * 1000).toLocaleString();
    }
  })
  .catch(() => {});

function useNow() {
  const d = new Date();
  // datetime-local input expects local time as YYYY-MM-DDTHH:MM
  document.getElementById('rtcSetVal').value =
    new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}

function setRtcTime() {
  const val = document.getElementById('rtcSetVal').value;
  if (!val) { msg('Enter a date/time first', true); return; }
  const epoch = Math.floor(new Date(val).getTime() / 1000);
  fetch('/api/rtc/time', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({epoch})
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) {
      document.getElementById('rtcNow').textContent = new Date(epoch * 1000).toLocaleString();
      msg('RTC time set', false);
    } else {
      msg('Error: ' + JSON.stringify(res), true);
    }
  })
  .catch(e => msg('Failed: ' + e.message, true));
}

// Load current config from device
fetch('/api/config')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(cfg => {
    for (const [k, v] of Object.entries(cfg)) {
      const el = document.getElementById(k);
      if (!el) continue;
      if (CHECKBOXES.includes(k)) el.checked = !!v;
      else el.value = (v === null || v === undefined) ? '' : v;
    }
    // Convert stored minutes to display hours
    if (cfg.tz_offset_mins !== undefined)
      document.getElementById('tz_offset_hours').value = cfg.tz_offset_mins / 60;
  })
  .catch(e => msg('Failed to load config: ' + e.message, true));

function reboot() {
  if (!confirm('Reboot the device?')) return;
  fetch('/api/reboot', {method:'POST'})
    .then(() => msg('Rebooting… reconnect in a few seconds.', false))
    .catch(() => msg('Rebooting…', false));
}

function save() {
  const cfg = {};

  document.querySelectorAll('select[id]').forEach(el => {
    if (SELECTS.includes(el.id)) cfg[el.id] = el.value;
  });
  // Convert display hours back to minutes
  const tzHours = parseFloat(document.getElementById('tz_offset_hours').value);
  if (!isNaN(tzHours)) cfg['tz_offset_mins'] = Math.round(tzHours * 60);

  document.querySelectorAll('input[id]').forEach(el => {
    const id = el.id;
    if (CHECKBOXES.includes(id)) {
      cfg[id] = el.checked;
    } else if (NUMBERS.includes(id)) {
      cfg[id] = Number(el.value);
    } else if (id === 'ap_password') {
      if (el.value !== '') cfg[id] = el.value;   // only send if changed
    } else if (el.value !== '') {
      cfg[id] = el.value;
    }
  });

  fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg)
  })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(res => {
    if (res.ok) msg('Saved. Reboot the device to apply Ethernet / hostname changes.', false);
    else        msg('Server error: ' + JSON.stringify(res), true);
  })
  .catch(e => msg('Save failed: ' + e.message, true));
}
</script>
</body>
</html>
