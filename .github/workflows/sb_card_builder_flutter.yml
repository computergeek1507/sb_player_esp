name: SB Card Builder (Flutter)

on:
  push:
    branches: [main]
    paths:
      - 'tools/sb_card_builder_flutter/**'
      - 'tools/sb_card_builder.py'
      - '.github/workflows/sb_card_builder_flutter.yml'
  pull_request:
    paths:
      - 'tools/sb_card_builder_flutter/**'
      - '.github/workflows/sb_card_builder_flutter.yml'
  workflow_dispatch:
    inputs:
      base_href:
        description: 'Build for another path instead of GitHub Pages (start and end with /); leave empty to deploy to Pages'
        default: ''

env:
  FLUTTER_VERSION: '3.47.6'
  # GitHub Pages serves a project site at https://<owner>.github.io/<repo>/
  BASE_HREF: ${{ inputs.base_href || format('/{0}/', github.event.repository.name) }}
  # Deploy pushes to main, and manual runs on main that keep the Pages path
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.base_href }}

defaults:
  run:
    working-directory: tools/sb_card_builder_flutter

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "$BASE_HREF"

      - uses: actions/upload-artifact@v4
        with:
          name: sb_card_builder-web
          path: tools/sb_card_builder_flutter/build/web/

      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/sb_card_builder_flutter/build/web/

  pages:
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.base_href
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: sb_card_builder-windows
          path: tools/sb_card_builder_flutter/build/windows/x64/runner/Release/

  release:
    needs: [web, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-builder-latest
    defaults:
      run:
        working-directory: .
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: builder-latest
      TITLE: SB Card Builder (latest build)
      NOTES: |-
        Rolling build of the SB Card Builder from main, updated automatically on every push.
        - sb_card_builder-flutter-windows.zip: Flutter desktop app for Windows (unzip, run sb_card_builder.exe)
        - sb_card_builder-qt-windows.zip: Qt app and command line tool for Windows (sb_card_builder.exe, sb_card_cli.exe)
        - sb_card_builder.py: Python version (Python 3.9+, run with no arguments for the GUI)
        The web version is at https://computergeek1507.github.io/sb_player_esp/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sb_card_builder-windows
          path: windows

      - name: Package
        run: |
          (cd windows && zip -qr ../sb_card_builder-flutter-windows.zip .)
          cp tools/sb_card_builder.py .

      - name: Update rolling release
        run: |
          printf '%s\n\nBuilt from %s on %s.\n' "$NOTES" "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes-file notes.md
          fi
          gh release upload "$TAG" sb_card_builder-flutter-windows.zip sb_card_builder.py --clobber
